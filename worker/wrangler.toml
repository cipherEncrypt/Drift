name = "drift-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787

[vars]
# Public treasury address throwers send NIM to (set your wallet)
POSTCARD_TREASURY_ADDRESS = "NQ620NRR9RBP3VMSDPAYHBEMB1VX3UDX9TXF"

# Nimiq JSON-RPC for postcard payouts (mainnet; Nimiq Pay uses real NIM)
NIMIQ_RPC_URL = "https://rpc.nimiqwatch.com"
NIMIQ_NETWORK_ID = "24"

[[d1_databases]]
binding = "DB"
database_name = "drift-db"
database_id = "c1ad463e-814e-4dad-9466-d61da8d25700"
